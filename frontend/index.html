<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelf — your reading, on a shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Custom icon set. Hand-drawn line icons, no emoji, no icon font. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 5.2A1.2 1.2 0 0 1 5.2 4H11v16H5.2A1.2 1.2 0 0 1 4 18.8zM20 5.2A1.2 1.2 0 0 0 18.8 4H13v16h5.8A1.2 1.2 0 0 0 20 18.8z"/>
        <path d="M11 4v16M13 4v16"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M7 4h10v16l-5-3.6L7 20z"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 3.5l2.55 5.17 5.7.83-4.13 4.02.98 5.68L12 16.9l-5.08 2.7.98-5.68L3.75 9.5l5.7-.83z"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9.5 7V5.2a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.9 12a1.2 1.2 0 0 0 1.2 1.1h6.8a1.2 1.2 0 0 0 1.2-1.1l.9-12"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.4 4.4L19 7.2"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </symbol>
      <symbol id="i-open-book" viewBox="0 0 24 24">
        <path d="M12 6.5C10 5 7 4.7 4.5 5.2v13C7 17.7 10 18 12 19.4M12 6.5c2-1.5 5-1.8 7.5-1.3v13C17 17.7 14 18 12 19.4M12 6.5v12.9"/>
      </symbol>
    </defs>
  </svg>

  <header class="appbar">
    <a class="brand" href="/" aria-label="Shelf home">
      <span class="brand-mark"><svg class="ic"><use href="#i-book"/></svg></span>
      <span class="brand-name">Shelf</span>
    </a>
    <button class="btn btn-primary" id="open-add" type="button">
      <svg class="ic"><use href="#i-plus"/></svg>
      Add book
    </button>
  </header>

  <main class="wrap">
    <section class="overview" aria-label="Your reading at a glance">
      <div class="stats" id="stats" role="group" aria-label="Counts">
        <span class="stat"><b id="stat-total">0</b> books</span>
        <span class="stat"><b id="stat-reading">0</b> reading</span>
        <span class="stat"><b id="stat-finished">0</b> finished</span>
        <span class="stat"><b id="stat-want">0</b> to read</span>
      </div>
      <div class="filters" id="filters" role="tablist" aria-label="Filter the shelf">
        <button class="filter is-active" role="tab" aria-selected="true" data-status="all" type="button">All</button>
        <button class="filter" role="tab" aria-selected="false" data-status="reading" type="button">Reading</button>
        <button class="filter" role="tab" aria-selected="false" data-status="finished" type="button">Finished</button>
        <button class="filter" role="tab" aria-selected="false" data-status="want_to_read" type="button">Want to read</button>
      </div>
    </section>

    <section class="shelf-frame" aria-label="Your shelf">
      <div class="shelf" id="shelf"><!-- spines rendered here --></div>

      <div class="empty" id="empty" hidden>
        <span class="empty-mark"><svg class="ic"><use href="#i-open-book"/></svg></span>
        <p class="empty-title">Your shelf is empty</p>
        <p class="empty-sub">Add the first book you're reading — or one you keep meaning to.</p>
        <button class="btn btn-primary" id="empty-add" type="button">
          <svg class="ic"><use href="#i-plus"/></svg>
          Add your first book
        </button>
      </div>
    </section>
  </main>

  <!-- Detail drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
    <div class="drawer-top">
      <span class="drawer-spine" id="d-spine" aria-hidden="true"></span>
      <button class="icon-btn" id="d-close" type="button" aria-label="Close details">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
    </div>

    <h2 class="drawer-title" id="d-title">Title</h2>
    <p class="drawer-author" id="d-author">Author</p>

    <div class="field">
      <span class="field-label">Status</span>
      <div class="segment" id="d-status" role="radiogroup" aria-label="Reading status">
        <button class="seg" data-status="want_to_read" type="button" role="radio" aria-checked="false">Want to read</button>
        <button class="seg" data-status="reading" type="button" role="radio" aria-checked="false">Reading</button>
        <button class="seg" data-status="finished" type="button" role="radio" aria-checked="false">Finished</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Rating</span>
      <div class="rating" id="d-rating" role="radiogroup" aria-label="Your rating">
        <button class="star" data-value="1" type="button" aria-label="1 star"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="star" data-value="2" type="button" aria-label="2 stars"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="star" data-value="3" type="button" aria-label="3 stars"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="star" data-value="4" type="button" aria-label="4 stars"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="star" data-value="5" type="button" aria-label="5 stars"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="rating-clear" id="d-rating-clear" type="button">Clear</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="d-notes">Notes</label>
      <textarea class="notes" id="d-notes" rows="4" placeholder="A line to remember it by."></textarea>
    </div>

    <button class="btn btn-danger" id="d-delete" type="button">
      <svg class="ic"><use href="#i-trash"/></svg>
      Remove from shelf
    </button>
  </aside>

  <!-- Add modal -->
  <div class="scrim" id="add-scrim" hidden></div>
  <div class="modal" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-heading" hidden>
    <div class="modal-head">
      <h2 class="modal-title" id="add-heading">Add a book</h2>
      <button class="icon-btn" id="add-close" type="button" aria-label="Close">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
    </div>
    <form id="add-form" novalidate>
      <div class="field">
        <label class="field-label" for="f-title">Title</label>
        <input class="input" id="f-title" name="title" type="text" placeholder="The book's title" autocomplete="off" />
        <span class="field-error" id="f-title-error" hidden>Add a title so you can find it later.</span>
      </div>
      <div class="field">
        <label class="field-label" for="f-author">Author</label>
        <input class="input" id="f-author" name="author" type="text" placeholder="Who wrote it (optional)" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="add-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Add to shelf</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
